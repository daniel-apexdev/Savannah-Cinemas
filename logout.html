<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — Savannah Cinemas</title>
    
    <!-- Fonts & Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Oswald:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --ink: #14141C;
            --ink-raised: #1D1D28;
            --ink-line: #2C2C3A;
            --paper: #F2EFE9;
            --paper-dim: #B9B6AC;
            --gold: #E8B34C;
            --gold-dim: #7A5C22;
            --rust: #B33951;
            --rust-hover: #c94661;
            --success: #4C9A6A;
            --font-display: 'Oswald', 'Bebas Neue', Impact, sans-serif;
            --font-body: 'Inter', 'Public Sans', -apple-system, sans-serif;
            --font-mono: 'IBM Plex Mono', 'Courier New', monospace;
            --radius-sm: 8px;
            --radius-md: 14px;
            --container-padding: clamp(16px, 4vw, 60px);
            --touch-target: clamp(44px, 5vw, 56px);
            --max-width: 1400px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--ink);
            color: var(--paper);
            font-family: var(--font-body);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }

        .auth-container {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px var(--container-padding);
            width: 100%;
        }

        .auth-card {
            background: var(--ink-raised);
            border: 1px solid var(--ink-line);
            border-radius: var(--radius-md);
            padding: clamp(32px, 4vw, 48px);
            max-width: 420px;
            width: 100%;
            animation: fadeInUp 0.5s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .auth-card .auth-title {
            font-family: var(--font-display);
            font-size: clamp(28px, 3vw, 36px);
            font-weight: 500;
            color: var(--paper);
            text-align: center;
            margin-bottom: 4px;
        }

        .auth-card .auth-title span {
            color: var(--gold);
        }

        .auth-card .auth-subtitle {
            font-size: clamp(14px, 1vw, 16px);
            color: var(--paper-dim);
            font-weight: 300;
            text-align: center;
            margin-bottom: 28px;
        }

        .auth-tabs {
            display: flex;
            gap: 0;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--ink-line);
            position: relative;
        }

        .auth-tabs .tab-btn {
            flex: 1;
            padding: 12px 0;
            background: none;
            border: none;
            color: var(--paper-dim);
            font-family: var(--font-body);
            font-size: clamp(14px, 1vw, 16px);
            font-weight: 400;
            cursor: pointer;
            transition: 0.3s ease;
            position: relative;
            touch-action: manipulation;
            min-height: var(--touch-target);
        }

        .auth-tabs .tab-btn:hover { color: var(--paper); }
        .auth-tabs .tab-btn.active { color: var(--gold); }
        .auth-tabs .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--gold);
            border-radius: 2px;
        }

        .auth-form {
            display: none;
            flex-direction: column;
            gap: 18px;
        }
        .auth-form.active { display: flex; }

        .auth-form .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
        }

        .auth-form .form-group label {
            font-size: clamp(12px, 0.8vw, 14px);
            color: var(--paper-dim);
            font-weight: 300;
            letter-spacing: 0.02em;
            display: block;
        }

        .auth-form .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: var(--ink);
            border: 1px solid var(--ink-line);
            border-radius: var(--radius-sm);
            color: var(--paper);
            font-family: var(--font-body);
            font-size: clamp(14px, 1vw, 16px);
            transition: 0.3s ease;
            min-height: var(--touch-target);
        }

        .auth-form .form-group input:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(232, 179, 76, 0.1);
        }

        .auth-form .form-group input::placeholder {
            color: var(--paper-dim);
            font-weight: 300;
        }

        .auth-form .form-group .input-hint {
            font-size: clamp(11px, 0.7vw, 13px);
            color: var(--paper-dim);
            font-weight: 300;
            margin-top: 4px;
        }

        .password-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
        }

        .password-input-wrapper input {
            flex: 1;
            padding: 12px 48px 12px 16px;
            background: var(--ink);
            border: 1px solid var(--ink-line);
            border-radius: var(--radius-sm);
            color: var(--paper);
            font-family: var(--font-body);
            font-size: clamp(14px, 1vw, 16px);
            transition: 0.3s ease;
            min-height: var(--touch-target);
            width: 100%;
        }

        .password-input-wrapper input:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(232, 179, 76, 0.1);
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            color: var(--paper-dim);
            cursor: pointer;
            padding: 8px;
            font-size: 18px;
            transition: 0.3s ease;
            touch-action: manipulation;
            min-width: var(--touch-target);
            min-height: var(--touch-target);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .password-toggle:hover { color: var(--paper); }
        .password-toggle:active { transform: scale(0.9); }

        .auth-form .form-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: clamp(12px, 0.8vw, 14px);
            color: var(--paper-dim);
            font-weight: 300;
            flex-wrap: wrap;
            gap: 8px;
        }

        .auth-form .form-options label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            touch-action: manipulation;
        }

        .auth-form .form-options label input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--gold);
            cursor: pointer;
        }

        .auth-form .form-options a {
            color: var(--gold);
            text-decoration: none;
            transition: 0.3s ease;
        }
        .auth-form .form-options a:hover { color: #f0c369; }

        .auth-btn {
            padding: 14px 0;
            background: var(--rust);
            color: var(--paper);
            border: none;
            border-radius: var(--radius-sm);
            font-family: var(--font-body);
            font-size: clamp(14px, 1vw, 16px);
            font-weight: 500;
            cursor: pointer;
            transition: 0.3s ease;
            min-height: var(--touch-target);
            touch-action: manipulation;
            width: 100%;
            margin-top: 4px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-btn:hover {
            background: var(--rust-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(179, 57, 81, 0.3);
        }
        .auth-btn:active { transform: scale(0.97); }
        .auth-btn:disabled {
            background: var(--ink-line);
            color: var(--paper-dim);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .auth-btn .btn-loader {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid var(--paper);
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .auth-btn.loading .btn-loader { display: block; }
        .auth-btn.loading .btn-text { display: none; }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .auth-btn.google-btn {
            background: transparent;
            border: 1px solid var(--ink-line);
            color: var(--paper);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 0;
        }

        .auth-btn.google-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            transform: none;
            box-shadow: none;
        }

        .auth-divider {
            display: flex;
            align-items: center;
            gap: 16px;
            color: var(--paper-dim);
            font-size: clamp(12px, 0.8vw, 14px);
            margin: 4px 0;
        }

        .auth-divider::before,
        .auth-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--ink-line);
        }

        .auth-message {
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            font-size: clamp(13px, 0.8vw, 15px);
            display: none;
            align-items: center;
            gap: 10px;
        }

        .auth-message.show {
            display: flex;
        }

        .auth-message.error {
            background: rgba(179, 57, 81, 0.15);
            border: 1px solid var(--rust);
            color: #f0a0b0;
        }

        .auth-message.success {
            background: rgba(76, 154, 106, 0.15);
            border: 1px solid var(--success);
            color: #7cc9a0;
        }

        .auth-message.info {
            background: rgba(232, 179, 76, 0.1);
            border: 1px solid var(--gold-dim);
            color: var(--gold);
        }

        .auth-message i {
            font-size: 18px;
            flex-shrink: 0;
        }

        /* Password Strength Styles */
        .password-strength {
            display: flex;
            gap: 6px;
            margin-top: 8px;
            height: 6px;
        }

        .password-strength .bar {
            flex: 1;
            height: 100%;
            background: var(--ink-line);
            border-radius: 3px;
            transition: background 0.3s ease;
        }

        .password-strength .bar.weak {
            background: var(--rust);
        }

        .password-strength .bar.medium {
            background: var(--gold);
        }

        .password-strength .bar.strong {
            background: var(--success);
        }

        .password-strength-text {
            font-size: clamp(11px, 0.7vw, 13px);
            color: var(--paper-dim);
            margin-top: 4px;
            font-weight: 300;
        }

        .password-strength-text.weak { color: var(--rust); }
        .password-strength-text.medium { color: var(--gold); }
        .password-strength-text.strong { color: var(--success); }

        /* Dialog Overlay */
        .dialog-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }

        .dialog-overlay.open {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .dialog-box {
            background: var(--ink-raised);
            border: 1px solid var(--ink-line);
            border-radius: var(--radius-md);
            padding: clamp(32px, 4vw, 40px);
            max-width: 420px;
            width: 100%;
            animation: slideUp 0.3s ease;
            position: relative;
        }

        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .dialog-box .dialog-title {
            font-family: var(--font-display);
            font-size: clamp(22px, 2.5vw, 28px);
            color: var(--gold);
            text-align: center;
            margin-bottom: 4px;
        }

        .dialog-box .dialog-subtitle {
            font-size: clamp(14px, 1vw, 16px);
            color: var(--paper-dim);
            font-weight: 300;
            text-align: center;
            margin-bottom: 24px;
        }

        .dialog-box .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
            margin-bottom: 16px;
        }

        .dialog-box .form-group label {
            font-size: clamp(12px, 0.8vw, 14px);
            color: var(--paper-dim);
            font-weight: 300;
            letter-spacing: 0.02em;
            display: block;
        }

        .dialog-box .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: var(--ink);
            border: 1px solid var(--ink-line);
            border-radius: var(--radius-sm);
            color: var(--paper);
            font-family: var(--font-body);
            font-size: clamp(14px, 1vw, 16px);
            transition: 0.3s ease;
            min-height: var(--touch-target);
        }

        .dialog-box .form-group input:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(232, 179, 76, 0.1);
        }

        .dialog-box .form-group input::placeholder {
            color: var(--paper-dim);
            font-weight: 300;
        }

        .dialog-box .input-hint {
            font-size: clamp(11px, 0.7vw, 13px);
            color: var(--paper-dim);
            font-weight: 300;
            margin-top: 2px;
        }

        .dialog-actions {
            display: flex;
            gap: 12px;
            margin-top: 4px;
        }

        .dialog-actions .auth-btn {
            flex: 1;
            margin-top: 0;
        }

        .dialog-actions .auth-btn.cancel-btn {
            background: transparent;
            border: 1px solid var(--ink-line);
            color: var(--paper-dim);
        }

        .dialog-actions .auth-btn.cancel-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            transform: none;
            box-shadow: none;
            color: var(--paper);
        }

        .dialog-actions .auth-btn.confirm-btn {
            background: var(--rust);
            color: var(--paper);
        }

        .dialog-actions .auth-btn.confirm-btn:hover {
            background: var(--rust-hover);
        }

        .dialog-message {
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            font-size: clamp(13px, 0.8vw, 15px);
            display: none;
            margin-bottom: 16px;
        }

        .dialog-message.show {
            display: block;
        }

        .dialog-message.error {
            background: rgba(179, 57, 81, 0.15);
            border: 1px solid var(--rust);
            color: #f0a0b0;
        }

        .dialog-message.success {
            background: rgba(76, 154, 106, 0.15);
            border: 1px solid var(--success);
            color: #7cc9a0;
        }

        .dialog-message.info {
            background: rgba(232, 179, 76, 0.1);
            border: 1px solid var(--gold-dim);
            color: var(--gold);
        }

        /* Responsive adjustments */
        @media (max-width: 480px) {
            .auth-card {
                padding: 24px 20px;
            }
            .auth-form .form-options {
                flex-direction: column;
                align-items: flex-start;
            }
            .dialog-box {
                padding: 24px 20px;
            }
            .dialog-actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

<div class="auth-container">
    <div class="auth-card">
        <h1 class="auth-title">SAVANNAH <span>CINEMAS</span></h1>
        <p class="auth-subtitle">Sign in to continue to your cinema experience</p>

        <!-- Tabs -->
        <div class="auth-tabs">
            <button class="tab-btn active" data-tab="login">Sign In</button>
            <button class="tab-btn" data-tab="register">Sign Up</button>
        </div>

        <!-- Message Display -->
        <div class="auth-message" id="authMessage">
            <i class="fas fa-circle-info"></i>
            <span class="message-text"></span>
        </div>

        <!-- LOGIN FORM -->
        <form class="auth-form active" id="loginForm" autocomplete="off">
            <div class="form-group">
                <label for="loginEmail">Email</label>
                <input type="email" id="loginEmail" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label for="loginPassword">Password</label>
                <div class="password-input-wrapper">
                    <input type="password" id="loginPassword" placeholder="••••••••" required>
                    <button type="button" class="password-toggle" aria-label="Toggle password visibility">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>
            </div>
            <div class="form-options">
                <label>
                    <input type="checkbox" id="rememberMe"> Remember me
                </label>
                <a href="#" id="forgotPasswordLink">Forgot password?</a>
            </div>
            <button type="submit" class="auth-btn" id="loginBtn">
                <span class="btn-loader"></span>
                <span class="btn-text">Sign In</span>
            </button>
        </form>

        <!-- REGISTER FORM -->
        <form class="auth-form" id="registerForm" autocomplete="off">
            <div class="form-group">
                <label for="registerName">Full Name</label>
                <input type="text" id="registerName" placeholder="John Doe" required>
            </div>
            <div class="form-group">
                <label for="registerEmail">Email</label>
                <input type="email" id="registerEmail" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label for="registerPassword">Password</label>
                <div class="password-input-wrapper">
                    <input type="password" id="registerPassword" placeholder="At least 8 characters" required minlength="8">
                    <button type="button" class="password-toggle" aria-label="Toggle password visibility">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>
                <!-- Password Strength Bars -->
                <div class="password-strength" id="passwordStrength">
                    <span class="bar" id="bar1"></span>
                    <span class="bar" id="bar2"></span>
                    <span class="bar" id="bar3"></span>
                    <span class="bar" id="bar4"></span>
                </div>
                <div class="password-strength-text" id="strengthText">Enter a password</div>
            </div>
            <div class="form-group">
                <label for="registerConfirmPassword">Confirm Password</label>
                <div class="password-input-wrapper">
                    <input type="password" id="registerConfirmPassword" placeholder="Confirm your password" required>
                    <button type="button" class="password-toggle" aria-label="Toggle password visibility">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>
            </div>
            <div class="form-options">
                <label>
                    <input type="checkbox" id="agreeTerms" required> I agree to the Terms & Conditions
                </label>
            </div>
            <button type="submit" class="auth-btn" id="registerBtn">
                <span class="btn-loader"></span>
                <span class="btn-text">Create Account</span>
            </button>
        </form>

        <div class="auth-divider">or</div>
        <button class="auth-btn google-btn" id="googleBtn" disabled>
            <i class="fa-brands fa-google"></i>
            <span>Continue with Google</span>
        </button>
    </div>
</div>

<!-- FORGOT PASSWORD DIALOG -->
<div class="dialog-overlay" id="resetDialog">
    <div class="dialog-box">
        <h2 class="dialog-title">Reset Password</h2>
        <p class="dialog-subtitle">Enter your email to receive a reset link</p>

        <div class="dialog-message" id="dialogMessage"></div>

        <div class="form-group">
            <label for="resetEmail">Email Address</label>
            <input type="email" id="resetEmail" placeholder="you@example.com" required>
            <span class="input-hint">We'll send you a password reset link</span>
        </div>

        <div class="dialog-actions">
            <button type="button" class="auth-btn cancel-btn" id="cancelResetBtn">
                <span class="btn-text">Cancel</span>
            </button>
            <button type="button" class="auth-btn confirm-btn" id="resetBtn">
                <span class="btn-loader"></span>
                <span class="btn-text">Send Link</span>
            </button>
        </div>
    </div>
</div>

<!-- RESET PASSWORD DIALOG (when token is in URL) -->
<div class="dialog-overlay" id="resetPasswordDialog">
    <div class="dialog-box">
        <h2 class="dialog-title">Set New Password</h2>
        <p class="dialog-subtitle">Enter your new password below</p>

        <div class="dialog-message" id="resetPasswordMessage"></div>

        <div class="form-group">
            <label for="newPassword">New Password</label>
            <div class="password-input-wrapper">
                <input type="password" id="newPassword" placeholder="At least 8 characters" minlength="8">
                <button type="button" class="password-toggle" aria-label="Toggle password visibility">
                    <i class="fa-regular fa-eye"></i>
                </button>
            </div>
        </div>

        <div class="form-group">
            <label for="confirmNewPassword">Confirm Password</label>
            <div class="password-input-wrapper">
                <input type="password" id="confirmNewPassword" placeholder="Confirm new password">
                <button type="button" class="password-toggle" aria-label="Toggle password visibility">
                    <i class="fa-regular fa-eye"></i>
                </button>
            </div>
        </div>

        <div class="dialog-actions">
            <button type="button" class="auth-btn cancel-btn" id="cancelResetPasswordBtn">
                <span class="btn-text">Cancel</span>
            </button>
            <button type="button" class="auth-btn confirm-btn" id="resetPasswordBtn">
                <span class="btn-loader"></span>
                <span class="btn-text">Reset Password</span>
            </button>
        </div>
    </div>
</div>

<script>
    const API_URL = 'http://10.20.10.150:5000/api';
    const AUTH_TOKEN_KEY = 'token';
    const USER_DATA_KEY = 'user';

    // ============================================================
    // DOM REFS
    // ============================================================
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const loginBtn = document.getElementById('loginBtn');
    const registerBtn = document.getElementById('registerBtn');
    const messageEl = document.getElementById('authMessage');
    const messageText = messageEl.querySelector('.message-text');

    // Dialog refs
    const resetDialog = document.getElementById('resetDialog');
    const resetPasswordDialog = document.getElementById('resetPasswordDialog');
    const resetEmail = document.getElementById('resetEmail');
    const resetBtn = document.getElementById('resetBtn');
    const cancelResetBtn = document.getElementById('cancelResetBtn');
    const dialogMessage = document.getElementById('dialogMessage');
    const resetPasswordMessage = document.getElementById('resetPasswordMessage');
    const newPassword = document.getElementById('newPassword');
    const confirmNewPassword = document.getElementById('confirmNewPassword');
    const resetPasswordBtn = document.getElementById('resetPasswordBtn');
    const cancelResetPasswordBtn = document.getElementById('cancelResetPasswordBtn');

    // ============================================================
    // PASSWORD TOGGLES
    // ============================================================
    document.querySelectorAll('.password-toggle').forEach(btn => {
        btn.addEventListener('click', () => {
            const input = btn.closest('.password-input-wrapper').querySelector('input');
            const icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fa-regular fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fa-regular fa-eye';
            }
        });
    });

    // ============================================================
    // TAB SWITCHING
    // ============================================================
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            const tab = btn.dataset.tab;
            document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));

            if (tab === 'login') document.getElementById('loginForm').classList.add('active');
            else if (tab === 'register') document.getElementById('registerForm').classList.add('active');

            hideMessage();
        });
    });

    // ============================================================
    // MESSAGE HELPERS
    // ============================================================
    function showMessage(message, type = 'info') {
        messageText.textContent = message;
        messageEl.className = `auth-message show ${type}`;
    }

    function hideMessage() {
        messageEl.className = 'auth-message';
        messageText.textContent = '';
    }

    function showDialogMessage(el, message, type = 'info') {
        el.textContent = message;
        el.className = `dialog-message show ${type}`;
    }

    function hideDialogMessage(el) {
        el.className = 'dialog-message';
        el.textContent = '';
    }

    // ============================================================
    // PASSWORD STRENGTH
    // ============================================================
    const registerPassword = document.getElementById('registerPassword');
    const bar1 = document.getElementById('bar1');
    const bar2 = document.getElementById('bar2');
    const bar3 = document.getElementById('bar3');
    const bar4 = document.getElementById('bar4');
    const strengthText = document.getElementById('strengthText');

    function updatePasswordStrength(password) {
        // Reset all bars
        [bar1, bar2, bar3, bar4].forEach(bar => {
            bar.className = 'bar';
        });

        if (!password || password.length === 0) {
            strengthText.textContent = 'Enter a password';
            strengthText.className = 'password-strength-text';
            return;
        }

        let score = 0;
        
        // Length check
        if (password.length >= 8) score++;
        if (password.length >= 12) score++;
        
        // Complexity checks
        if (/[a-z]/.test(password) && /[A-Z]/.test(password)) score++;
        if (/\d/.test(password)) score++;
        if (/[^a-zA-Z0-9]/.test(password)) score++;

        // Determine strength level (0-4)
        let level = 0;
        let label = '';
        let className = '';

        if (score <= 1) {
            level = 1;
            label = 'Weak';
            className = 'weak';
        } else if (score <= 2) {
            level = 2;
            label = 'Fair';
            className = 'weak';
        } else if (score <= 3) {
            level = 3;
            label = 'Medium';
            className = 'medium';
        } else if (score <= 4) {
            level = 4;
            label = 'Strong';
            className = 'strong';
        } else {
            level = 4;
            label = 'Very Strong';
            className = 'strong';
        }

        // Apply classes to bars
        const bars = [bar1, bar2, bar3, bar4];
        for (let i = 0; i < bars.length; i++) {
            if (i < level) {
                bars[i].className = `bar ${className}`;
            }
        }

        strengthText.textContent = label;
        strengthText.className = `password-strength-text ${className}`;
    }

    registerPassword.addEventListener('input', () => {
        updatePasswordStrength(registerPassword.value);
    });

    // ============================================================
    // REGISTER
    // ============================================================
    registerForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideMessage();

        const name = document.getElementById('registerName').value.trim();
        const email = document.getElementById('registerEmail').value.trim();
        const password = document.getElementById('registerPassword').value;
        const confirm = document.getElementById('registerConfirmPassword').value;
        const terms = document.getElementById('agreeTerms').checked;

        if (!name) return showMessage('Please enter your full name', 'error');
        if (!email) return showMessage('Please enter your email', 'error');
        if (!password || password.length < 8) return showMessage('Password must be at least 8 characters', 'error');
        if (password !== confirm) return showMessage('Passwords do not match', 'error');
        if (!terms) return showMessage('Please agree to the Terms & Conditions', 'error');

        setLoading(registerBtn, true);

        try {
            const res = await fetch(`${API_URL}/auth/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, password })
            });

            const data = await res.json();

            if (data.success) {
                saveAuth(data.token, data.user);
                showMessage('Account created successfully! Redirecting...', 'success');
                setTimeout(() => window.location.href = 'index.html', 1500);
            } else {
                showMessage(data.message || 'Registration failed', 'error');
            }
        } catch (err) {
            showMessage('Network error. Please check your connection.', 'error');
        } finally {
            setLoading(registerBtn, false);
        }
    });

    // ============================================================
    // LOGIN
    // ============================================================
    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideMessage();

        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;

        if (!email || !password) return showMessage('Please fill in all fields', 'error');

        setLoading(loginBtn, true);

        try {
            const res = await fetch(`${API_URL}/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const data = await res.json();

            if (data.success) {
                saveAuth(data.token, data.user);
                showMessage('Welcome back! Redirecting...', 'success');
                setTimeout(() => window.location.href = 'index.html', 1200);
            } else {
                showMessage(data.message || 'Invalid email or password', 'error');
            }
        } catch (err) {
            showMessage('Network error. Please check your connection.', 'error');
        } finally {
            setLoading(loginBtn, false);
        }
    });

    // ============================================================
    // FORGOT PASSWORD - OPEN DIALOG
    // ============================================================
    document.getElementById('forgotPasswordLink').addEventListener('click', (e) => {
        e.preventDefault();
        resetDialog.classList.add('open');
        resetEmail.value = '';
        hideDialogMessage(dialogMessage);
        setLoading(resetBtn, false);
    });

    // ============================================================
    // CANCEL RESET DIALOG
    // ============================================================
    cancelResetBtn.addEventListener('click', () => {
        resetDialog.classList.remove('open');
        hideDialogMessage(dialogMessage);
        setLoading(resetBtn, false);
    });

    // Close dialog on overlay click
    resetDialog.addEventListener('click', (e) => {
        if (e.target === resetDialog) {
            resetDialog.classList.remove('open');
            hideDialogMessage(dialogMessage);
            setLoading(resetBtn, false);
        }
    });

    // Close on Escape key
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            if (resetDialog.classList.contains('open')) {
                resetDialog.classList.remove('open');
                hideDialogMessage(dialogMessage);
                setLoading(resetBtn, false);
            }
            if (resetPasswordDialog.classList.contains('open')) {
                resetPasswordDialog.classList.remove('open');
                hideDialogMessage(resetPasswordMessage);
                setLoading(resetPasswordBtn, false);
            }
        }
    });

    // ============================================================
    // SEND RESET LINK
    // ============================================================
    resetBtn.addEventListener('click', async () => {
        const email = resetEmail.value.trim();

        if (!email) {
            return showDialogMessage(dialogMessage, 'Please enter your email address', 'error');
        }

        setLoading(resetBtn, true);
        hideDialogMessage(dialogMessage);

        try {
            const res = await fetch(`${API_URL}/auth/request-reset`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });

            const data = await res.json();

            if (data.success) {
                showDialogMessage(dialogMessage, 'Reset link sent to your email!', 'success');
                resetEmail.value = '';
                
                if (data.resetToken) {
                    console.log('Reset Token (dev):', data.resetToken);
                    setTimeout(() => {
                        showDialogMessage(dialogMessage, 'Check your email (dev token logged in console)', 'info');
                    }, 2000);
                }

                setTimeout(() => {
                    resetDialog.classList.remove('open');
                    hideDialogMessage(dialogMessage);
                    setLoading(resetBtn, false);
                }, 3000);
            } else {
                showDialogMessage(dialogMessage, data.message || 'Failed to send reset link', 'error');
                setLoading(resetBtn, false);
            }
        } catch (err) {
            showDialogMessage(dialogMessage, 'Network error. Please check your connection.', 'error');
            setLoading(resetBtn, false);
        }
    });

    // ============================================================
    // CHECK FOR RESET TOKEN IN URL
    // ============================================================
    function checkResetToken() {
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');
        if (token) {
            console.log('Reset token found:', token);
            showResetPasswordDialog(token);
            // Clean URL without reloading
            const newUrl = window.location.pathname;
            window.history.replaceState({}, document.title, newUrl);
        }
    }

    function showResetPasswordDialog(token) {
        resetPasswordDialog.classList.add('open');
        newPassword.value = '';
        confirmNewPassword.value = '';
        hideDialogMessage(resetPasswordMessage);
        setLoading(resetPasswordBtn, false);

        // Store token for use
        resetPasswordDialog.dataset.token = token;
    }

    // ============================================================
    // CANCEL RESET PASSWORD DIALOG
    // ============================================================
    cancelResetPasswordBtn.addEventListener('click', () => {
        resetPasswordDialog.classList.remove('open');
        hideDialogMessage(resetPasswordMessage);
        setLoading(resetPasswordBtn, false);
    });

    resetPasswordDialog.addEventListener('click', (e) => {
        if (e.target === resetPasswordDialog) {
            resetPasswordDialog.classList.remove('open');
            hideDialogMessage(resetPasswordMessage);
            setLoading(resetPasswordBtn, false);
        }
    });

    // ============================================================
    // RESET PASSWORD
    // ============================================================
    resetPasswordBtn.addEventListener('click', async () => {
        const token = resetPasswordDialog.dataset.token;
        const password = newPassword.value;
        const confirm = confirmNewPassword.value;

        if (!password || password.length < 8) {
            return showDialogMessage(resetPasswordMessage, 'Password must be at least 8 characters', 'error');
        }
        if (password !== confirm) {
            return showDialogMessage(resetPasswordMessage, 'Passwords do not match', 'error');
        }

        setLoading(resetPasswordBtn, true);
        hideDialogMessage(resetPasswordMessage);

        try {
            const res = await fetch(`${API_URL}/auth/reset-password`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token, newPassword: password })
            });

            const data = await res.json();

            if (data.success) {
                showDialogMessage(resetPasswordMessage, 'Password reset successful!', 'success');
                setTimeout(() => {
                    resetPasswordDialog.classList.remove('open');
                    hideDialogMessage(resetPasswordMessage);
                    setLoading(resetPasswordBtn, false);
                    // Switch to login tab
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    document.querySelector('.tab-btn[data-tab="login"]').classList.add('active');
                    document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
                    document.getElementById('loginForm').classList.add('active');
                    showMessage('Password reset successfully. Please sign in.', 'success');
                }, 2000);
            } else {
                showDialogMessage(resetPasswordMessage, data.message || 'Failed to reset password', 'error');
                setLoading(resetPasswordBtn, false);
            }
        } catch (err) {
            showDialogMessage(resetPasswordMessage, 'Network error. Please try again.', 'error');
            setLoading(resetPasswordBtn, false);
        }
    });

    // ============================================================
    // UTILITY FUNCTIONS
    // ============================================================
    function setLoading(btn, loading) {
        if (loading) {
            btn.classList.add('loading');
            btn.disabled = true;
        } else {
            btn.classList.remove('loading');
            btn.disabled = false;
        }
    }

    function saveAuth(token, user) {
        localStorage.setItem(AUTH_TOKEN_KEY, token);
        localStorage.setItem(USER_DATA_KEY, JSON.stringify(user));
    }

    // ============================================================
    // CHECK IF ALREADY LOGGED IN
    // ============================================================
    function checkAuth() {
        const token = localStorage.getItem(AUTH_TOKEN_KEY);
        if (token) {
            fetch(`${API_URL}/auth/me`, {
                headers: { 'Authorization': `Bearer ${token}` }
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    window.location.href = 'index.html';
                } else {
                    localStorage.removeItem(AUTH_TOKEN_KEY);
                    localStorage.removeItem(USER_DATA_KEY);
                }
            })
            .catch(() => {});
        }
    }

    // ============================================================
    // INIT
    // ============================================================
    checkAuth();
    checkResetToken();

    console.log('Savannah Cinemas Auth Page Loaded');
</script>

</body>
</html>
