<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Marquee — Sign In / Create Account</title>
<style>

  :root{
    --ink:          #14141C;
    --ink-raised:   #1D1D28;
    --ink-line:     #2C2C3A;
    --paper:        #F2EFE9;
    --paper-dim:    #B9B6AC;
    --gold:         #E8B34C;
    --gold-dim:     #7A5C22;
    --velvet:       #B33951;
    --velvet-dim:   #6E2333;
    --stub-hole:    #14141C;
    --success:      #4C9A6A;
    --error:        #D9636B;

    --font-display: 'Oswald', 'Bebas Neue', Impact, sans-serif;
    --font-body:    'Inter', 'Public Sans', -apple-system, sans-serif;
    --font-mono:    'IBM Plex Mono', 'Courier New', monospace;
  }

  *{ box-sizing:border-box; }
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 15%, rgba(232,179,76,0.07), transparent 45%),
      radial-gradient(circle at 85% 85%, rgba(179,57,81,0.08), transparent 45%),
      var(--ink);
    color:var(--paper);
    font-family:var(--font-body);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 20px;
  }

  .nav-brand{
    font-family:var(--font-display);
    font-size:24px; letter-spacing:.04em;
    color:var(--paper); text-transform:uppercase;
    text-align:center;
  }
  .nav-brand span{ color:var(--gold); }

  /* ---------- AUTH CARD ---------- */
  .auth-shell{
    width:100%;
    max-width:420px;
  }
  .auth-tagline{
    text-align:center;
    color:var(--paper-dim);
    font-size:13px;
    margin:8px 0 28px;
  }

  .auth-card{
    background:var(--ink-raised);
    border:1px solid var(--ink-line);
    border-radius:16px;
    overflow:hidden;
  }

  /* ---------- SEGMENTED TOGGLE ---------- */
  .auth-toggle{
    display:flex;
    margin:20px;
    background:var(--ink);
    border:1px solid var(--ink-line);
    border-radius:999px;
    padding:4px;
  }
  .auth-toggle button{
    flex:1;
    border:none;
    background:none;
    padding:10px 0;
    border-radius:999px;
    font-family:var(--font-body);
    font-size:13px;
    font-weight:600;
    color:var(--paper-dim);
    cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  .auth-toggle button.active{
    background:var(--gold);
    color:#2A1D06;
  }

  /* ---------- FORM ---------- */
  .auth-form{
    padding:4px 24px 24px;
  }
  .auth-form.hidden{ display:none; }

  .field{
    margin-bottom:16px;
  }
  .field label{
    display:block;
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--paper-dim);
    margin-bottom:8px;
  }
  .field-input{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--ink);
    border:1px solid var(--ink-line);
    border-radius:10px;
    padding:12px 14px;
    transition:border-color .15s ease;
  }
  .field-input:focus-within{
    border-color:var(--gold-dim);
  }
  .field-input svg{
    flex:none;
    opacity:.5;
  }
  .field-input input{
    flex:1;
    background:none;
    border:none;
    outline:none;
    color:var(--paper);
    font-family:var(--font-body);
    font-size:14px;
  }
  .field-input input::placeholder{ color:var(--paper-dim); }
  .field-input button{
    flex:none;
    background:none;
    border:none;
    color:var(--paper-dim);
    cursor:pointer;
    padding:0;
    display:flex;
  }
  .field-input button:hover{ color:var(--paper); }

  .field-hint{
    font-size:11px;
    color:var(--paper-dim);
    margin-top:6px;
  }
  .field-hint.error{ color:var(--error); }

  .row-between{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:-4px 0 20px;
  }
  .checkbox-row{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    color:var(--paper-dim);
  }
  .checkbox-row input{ accent-color:var(--gold); }
  .link-muted{
    font-size:13px;
    color:var(--paper-dim);
    text-decoration:none;
  }
  .link-muted:hover{ color:var(--gold); }

  .btn-submit{
    width:100%;
    background:var(--velvet);
    color:var(--paper);
    border:none;
    border-radius:10px;
    padding:13px 0;
    font-family:var(--font-body);
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    transition:background .15s ease;
  }
  .btn-submit:hover{ background:#c94661; }

  /* ---------- DIVIDER / TEAR-LINE ---------- */
  .auth-tear{
    position:relative;
    height:0;
    border-top:1px dashed var(--ink-line);
    margin:4px 24px 20px;
  }
  .auth-tear::before,.auth-tear::after{
    content:"";
    position:absolute; top:-8px;
    width:16px; height:16px;
    background:var(--ink-raised);
    border-radius:50%;
  }
  .auth-tear::before{ left:-32px; }
  .auth-tear::after{ right:-32px; }

  .auth-footer-note{
    text-align:center;
    color:var(--paper-dim);
    font-size:12px;
    font-family:var(--font-mono);
    padding-bottom:24px;
  }
  .auth-footer-note span{ color:var(--gold); }

  .auth-switch{
    text-align:center;
    font-size:13px;
    color:var(--paper-dim);
    margin-top:20px;
  }
  .auth-switch a{
    color:var(--gold);
    text-decoration:none;
    font-weight:600;
    cursor:pointer;
  }
  .auth-switch a:hover{ text-decoration:underline; }

</style>
</head>
<body>

  <div class="auth-shell">
    <div class="nav-brand">MAR<span>QUEE</span></div>
    <p class="auth-tagline">Book the seat. Keep the stub.</p>

    <div class="auth-card">

      <div class="auth-toggle">
        <button type="button" class="active" id="tabSignIn">Sign in</button>
        <button type="button" id="tabSignUp">Create account</button>
      </div>

      <!-- SIGN IN -->
      <form class="auth-form" id="formSignIn">
        <div class="field">
          <label for="siUsername">Username</label>
          <div class="field-input">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
            <input id="siUsername" type="text" placeholder="jordantaylor" autocomplete="username">
          </div>
        </div>
        <div class="field">
          <label for="siPassword">Password</label>
          <div class="field-input">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input id="siPassword" type="password" placeholder="••••••••" autocomplete="current-password">
            <button type="button" class="pw-toggle" data-target="siPassword" aria-label="Show password">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <div class="row-between">
          <label class="checkbox-row">
            <input type="checkbox"> Remember me
          </label>
          <a href="#" class="link-muted">Forgot password?</a>
        </div>
        <button type="submit" class="btn-submit">Sign in</button>
      </form>

      <!-- SIGN UP -->
      <form class="auth-form hidden" id="formSignUp">
        <div class="field">
          <label for="suFirstName">First name</label>
          <div class="field-input">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
            <input id="suFirstName" type="text" placeholder="Jordan" autocomplete="given-name">
          </div>
        </div>
        <div class="field">
          <label for="suLastName">Last name</label>
          <div class="field-input">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
            <input id="suLastName" type="text" placeholder="Taylor" autocomplete="family-name">
          </div>
        </div>
        <div class="field">
          <label for="suEmail">Email</label>
          <div class="field-input">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z"/><path d="m22 6-10 7L2 6"/></svg>
            <input id="suEmail" type="email" placeholder="you@example.com" autocomplete="email">
          </div>
        </div>
        <div class="field">
          <label for="suUsername">Username</label>
          <div class="field-input">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
            <input id="suUsername" type="text" placeholder="jordantaylor" autocomplete="username">
          </div>
        </div>
        <div class="field">
          <label for="suPassword">Password</label>
          <div class="field-input">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input id="suPassword" type="password" placeholder="••••••••" autocomplete="new-password">
            <button type="button" class="pw-toggle" data-target="suPassword" aria-label="Show password">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <div class="field-hint">At least 8 characters, one number</div>
        </div>
        <div class="row-between" style="margin-bottom:20px;">
          <label class="checkbox-row">
            <input type="checkbox"> I agree to the Terms &amp; Privacy Policy
          </label>
        </div>
        <button type="submit" class="btn-submit">Create account</button>
      </form>

      <div class="auth-tear"></div>
      <p class="auth-footer-note">Join thousands tracking their <span>watch history</span> and booking faster</p>
    </div>

    <p class="auth-switch" id="switchLine">
      New here? <a id="switchToSignUp">Create an account</a>
    </p>
  </div>

  <script>
    var tabSignIn  = document.getElementById('tabSignIn');
    var tabSignUp  = document.getElementById('tabSignUp');
    var formSignIn = document.getElementById('formSignIn');
    var formSignUp = document.getElementById('formSignUp');
    var switchLine = document.getElementById('switchLine');

    function showSignIn(){
      tabSignIn.classList.add('active');
      tabSignUp.classList.remove('active');
      formSignIn.classList.remove('hidden');
      formSignUp.classList.add('hidden');
      switchLine.innerHTML = 'New here? <a id="switchToSignUp">Create an account</a>';
      document.getElementById('switchToSignUp').addEventListener('click', showSignUp);
    }
    function showSignUp(){
      tabSignUp.classList.add('active');
      tabSignIn.classList.remove('active');
      formSignUp.classList.remove('hidden');
      formSignIn.classList.add('hidden');
      switchLine.innerHTML = 'Already have an account? <a id="switchToSignIn">Sign in</a>';
      document.getElementById('switchToSignIn').addEventListener('click', showSignIn);
    }

    tabSignIn.addEventListener('click', showSignIn);
    tabSignUp.addEventListener('click', showSignUp);
    document.getElementById('switchToSignUp').addEventListener('click', showSignUp);

    // password show/hide toggles
    document.querySelectorAll('.pw-toggle').forEach(function(btn){
      btn.addEventListener('click', function(){
        var input = document.getElementById(btn.dataset.target);
        input.type = input.type === 'password' ? 'text' : 'password';
      });
    });
  </script>

</body>
</html>
